# Local, offline stack: everything Reelplane needs before any cloud account exists.
#   pnpm infra:up     start Postgres + RustFS (S3-compatible storage)
#   pnpm infra:init   create the bucket and its CORS rules
#
# RustFS replaces MinIO: MinIO stopped publishing community images in Oct 2025
# (see docs/SERVICES.md). Any S3-compatible server works; only STORAGE_* changes.

name: reelplane

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: reelplane
      POSTGRES_PASSWORD: reelplane
      POSTGRES_DB: reelplane
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelplane -d reelplane"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: reelplane
      RUSTFS_SECRET_KEY: reelplane-dev-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/health || wget -qO- http://localhost:9000/health",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
