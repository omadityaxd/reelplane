# Dependabot version updates. Security updates (for known vulnerabilities) are switched on in the
# repository settings and arrive regardless of these schedules. Minor and patch updates are
# grouped so a week's updates come as one pull request per ecosystem; CI runs on each.
version: 2
updates:
  # The pnpm workspace: one lockfile at the root covers apps/web and packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the runtime (.nvmrc, Vercel): a newer major would type-check APIs
      # the deployed Node doesn't have. Bump by hand with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /services/worker
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # The worker image's digest-pinned base images (Go build image, Debian runtime).
  - package-ecosystem: docker
    directory: /services/worker
    schedule:
      interval: weekly
      day: monday

  # Keeps the SHA-pinned actions current (it updates the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
