# Lint, typecheck and every unit/integration test (TypeScript and Go) against a real Postgres:
# the same `pnpm check` as on a laptop. The Playwright e2e suites need the whole stack and a
# browser with H.264, so they stay local (see apps/web/playwright.config.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the code. Actions are pinned to commit SHAs (Dependabot
# keeps them current), and checkout doesn't leave the token in .git for later steps.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Same image as docker-compose.yml; the port the tests default to (54320).
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: reelplane
          POSTGRES_PASSWORD: reelplane
          POSTGRES_DB: reelplane
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U reelplane -d reelplane"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://reelplane:reelplane@localhost:54320/reelplane
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # pnpm version from package.json's packageManager
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/worker/go.mod
          cache-dependency-path: services/worker/go.sum

      # The worker's tests transcode real clips. Ubuntu's FFmpeg (6.1) lacks options they use
      # (-display_rotation is 7.0+), so use a static 9.0 build, the version used in development.
      - name: Install FFmpeg 9.0
        run: |
          curl -fsSL -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: ffmpeg -hide_banner -version | head -1

      - name: Migrate the database
        run: pnpm db:migrate

      # lint → typecheck → TypeScript tests → gofmt + go vet → Go tests
      - run: pnpm check
